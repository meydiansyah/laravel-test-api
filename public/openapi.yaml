openapi: 3.0.3
info:
  title: Test API
  version: 1.0.0
servers:
  - url: /api
security:
  - ApiToken: []
    PayloadToken: []
paths:
  /profile:
    get:
      summary: Verifikasi token dan tampilkan profil dari payload
      responses:
        '200':
          description: Token valid
          content:
            application/json:
              schema:
                type: object
                properties:
                  status: { type: string, example: success }
                  data:
                    type: object
                    properties:
                      user_id: { type: integer, nullable: true, example: 1 }
                      name: { type: string, nullable: true, example: Budi }
                      role: { type: string, nullable: true, example: admin }
                      issued_at: { type: string, format: date-time, nullable: true }
                      expires_at: { type: string, format: date-time }
                      verified_at: { type: string, format: date-time }
        '401':
          description: API token / payload token salah atau kedaluwarsa
          content:
            application/json:
              schema:
                type: object
                properties:
                  message: { type: string, example: Invalid API token }
        '429':
          description: Terlalu banyak request
components:
  securitySchemes:
    ApiToken:
      type: apiKey
      in: header
      name: X-Api-Token
      description: Nilai API_TOKEN dari .env
    PayloadToken:
      type: apiKey
      in: header
      name: X-Payload-Token
      description: "base64url(json).base64url(HMAC-SHA256) dengan API_PAYLOAD_SECRET"
